# Mode A: no DAG — discover the structure from data with PC, orient what the
# algorithm can't with background knowledge, fit, refute, emit.
#
#   ydbms-pipeline run examples/discovery.yaml --dry-run
run:
  name: discovery_demo
  seed: 42
data:
  path: data/observations.csv
  roles:
    treatment_col: treatment
    outcome_col: outcome
discovery:
  algorithm: pc                    # pc | ges | lingam (ydbms-pipeline registry)
  params:
    alpha: 0.05
    indep_test: fisherz
  knowledge:
    required: [[confounder_col, treatment_col]]
    forbidden: [[outcome_col, treatment_col]]
    tiers: [[confounder_col], [treatment_col], [outcome_col]]
resolve:
  undirected_policy: prior         # fail | prior | heuristic
model:
  hypothesis: linear-gaussian
refute:
  tests: [ci, gof]
  on_failure: block
emit:
  model_name: DiscoveredModel
  out: out/discovered.causal
