[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causal4j-pipeline"
version = "0.1.0"
description = "Ingestion pipeline for Causal4j: causal discovery + SEM fitting upstream of the DB, emitting .causal DSL files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "networkx>=3.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
discovery = ["causal-learn>=0.1.3.8"]
refute = ["dowhy>=0.11"]
neo4j = ["neo4j>=5.0"]
dev = ["pytest>=7.0"]

[project.scripts]
causal4j-pipeline = "causal4j_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["causal4j_pipeline*"]
