name: test
# Manual only (Actions tab -> test -> Run workflow): the private repository is out of
# Actions minutes. The push/pull_request triggers come back when the repository is
# public for the artifact. Until then every merge into feat/index is gated on
# `mvn test` from the repo root, run locally, with the test count in the PR description.
on:
  workflow_dispatch:
jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test -Dgroups='!synthetic,!slow'
  bench-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # meta.json records the generator's last commit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: bench/py/pyproject.toml
      - run: pip install -e 'bench/py[test]'
      - run: causal4j-bench fetch --only asia     # downloads asia only and checks its SHA-256
      - run: causal4j-bench covid
      - run: causal4j-bench policy
      - run: causal4j-bench synth --only n=100
      - run: causal4j-bench workloads --only asia,covid,policy
      - run: causal4j-bench workloads --balanced --only asia,covid,policy
      - run: pytest -q bench/py
      - name: Regenerated files match the committed ones
        run: git diff --exit-code -- bench
  bench-quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: bench/py/pyproject.toml
      - run: pip install -e 'bench/py[plots]'
      - run: causal4j-bench fetch --only asia,alarm
      - run: causal4j-bench synth --only n=100
      - run: mvn -B -q package -pl bench -am -DskipTests
      - run: mvn -B test -pl bench -am -Dtest=BaselineAgreementTest -Dsurefire.failIfNoSpecifiedTests=false  # Cypher/GDS == index
      - run: RUN_ID=ci bench/run_quick.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bench-quick
          path: |
            bench/results/ci
            bench/out/ci
