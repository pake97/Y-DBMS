[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ydbms_bench"
version = "0.1.0"
description = "Datasets, workloads and reference answers for the Y-DBMS evaluation"
requires-python = ">=3.10"
dependencies = ["networkx>=3.2", "numpy>=1.24", "pgmpy>=0.1.24"]

[project.optional-dependencies]
r = ["rpy2>=3.5"]          # plus R and the CRAN package dagitty
test = ["pytest>=7"]
plots = ["matplotlib>=3.7"]                              # results_to_tex
external = ["neo4j>=5.20", "causal-learn>=0.1.3", "dowhy>=0.11"]  # roundtrip (plus [r])

[project.scripts]
ydbms-bench = "ydbms_bench.cli:main"

[tool.setuptools]
packages = ["ydbms_bench"]
